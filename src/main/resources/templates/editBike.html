<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Bike</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<h1>Edit Bike</h1>

<p class="error" th:if="${error}" th:text="${error}"></p>

<form th:action="@{/bikes/edit}" method="post">

    <label>Bike ID</label>
    <input type="text" name="bikeId" th:value="${bike.bikeId}" readonly>

    <label>Model</label>
    <input type="text" name="model" th:value="${bike.model}" required>

    <label>Type</label>
    <select name="type">
        <option value="Motorbike" th:selected="${bike.type == 'Motorbike'}">Motorbike</option>
        <option value="Scooter" th:selected="${bike.type == 'Scooter'}">Scooter</option>
        <option value="Bicycle" th:selected="${bike.type == 'Bicycle'}">Bicycle</option>
    </select>

    <label>Location</label>
    <input type="text" name="location" th:value="${bike.location}" required>

    <label>Price per Day</label>
    <input type="number" name="pricePerDay" step="0.01" th:value="${bike.pricePerDay}" required>

    <label>Available</label>
    <select name="available">
        <option value="true" th:selected="${bike.available}">Yes</option>
        <option value="false" th:selected="${!bike.available}">No</option>
    </select>

    <label>Status</label>
    <select name="status">
        <option value="Active" th:selected="${bike.status == 'Active'}">Active</option>
        <option value="Maintenance" th:selected="${bike.status == 'Maintenance'}">Maintenance</option>
    </select>

    <br><br>
    <button type="submit">Update Bike</button>
    <a th:href="@{/bikes}">Cancel</a>
</form>

</body>
</html>
