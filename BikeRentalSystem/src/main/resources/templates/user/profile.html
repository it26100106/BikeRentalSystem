<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RIDEX | My account</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">

    <div th:replace="~{fragments/layout :: navbar('')}"></div>

    <h1 class="page-title">My account</h1>
    <p class="sub">Manage your profile details.</p>

    <div class="grid-profile">

        <!-- Left: summary card -->
        <div class="card" th:with="parts=${#strings.arraySplit(user.name, ' ')}">
            <div class="avatar"
                 th:text="${#strings.toUpperCase(#strings.substring(parts[0], 0, 1) + (parts.length > 1 ? #strings.substring(parts[parts.length - 1], 0, 1) : ''))}">KP</div>
            <p class="profile-name" th:text="${user.name}">Kasun Perera</p>
            <p class="profile-meta">User ID: <span th:text="${user.userId}">U001</span></p>
            <p class="profile-meta" th:text="${user.email}">kasun@mail.com</p>
            <span class="badge" th:text="${user.role}">Customer</span>
            <div>
                <a class="btn btn-outline" th:href="@{/users/logout}">Log out</a>
            </div>
        </div>

        <!-- Right: edit form -->
        <div class="card">
            <h2 class="card-title">Edit profile</h2>

            <div class="alert" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/users/profile}" th:object="${userUpdateDTO}" method="post">
                <div class="field">
                    <label for="name">Full name</label>
                    <input id="name" type="text" th:field="*{name}">
                </div>
                <div class="row">
                    <div class="field">
                        <label for="phone">Phone</label>
                        <input id="phone" type="text" th:field="*{phone}">
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <!-- not part of UserUpdateDTO, so it is shown but cannot be edited -->
                        <input id="email" type="email" th:value="${user.email}" disabled>
                    </div>
                </div>
                <div class="field">
                    <label for="address">Address</label>
                    <input id="address" type="text" th:field="*{address}">
                </div>
                <div class="field">
                    <label for="newPassword">New password (optional, min 6)</label>
                    <input id="newPassword" type="password" th:field="*{newPassword}">
                    <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Save changes</button>
                    <!-- submits the separate delete form below -->
                    <button type="submit" form="deleteForm" class="btn btn-danger-outline"
                            onclick="return confirm('Delete your account permanently?');">Delete account</button>
                </div>
            </form>

            <form id="deleteForm" th:action="@{/users/delete}" method="post"></form>
        </div>

    </div>
</div>
</body>
</html>
