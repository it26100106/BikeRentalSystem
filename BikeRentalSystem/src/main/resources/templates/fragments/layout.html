<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Shared navbar. Use in every page:
     <div th:replace="~{fragments/layout :: navbar('home')}"></div>
     The argument is the active tab: home, bikes, bookings, rides, payments, reviews -->
<header th:fragment="navbar(active)" class="nav">
    <a class="brand" th:href="@{/}">RIDE<span>X</span></a>

    <nav class="nav-links">
        <a th:href="@{/}"            th:classappend="${active == 'home'} ? 'active'">Home</a>
        <a th:href="@{/bikes}"       th:classappend="${active == 'bikes'} ? 'active'">Bikes</a>
        <a th:href="@{/bookings/my}" th:classappend="${active == 'bookings'} ? 'active'">Bookings</a>
        <a th:href="@{/rides}"       th:classappend="${active == 'rides'} ? 'active'">Rides</a>
        <a th:href="@{/payment}"     th:classappend="${active == 'payments'} ? 'active'">Payments</a>
        <a th:href="@{/reviews}"     th:classappend="${active == 'reviews'} ? 'active'">Reviews</a>
    </nav>

    <a th:if="${loggedInUser == null}" class="btn" th:href="@{/users/login}">Sign in</a>
    <a th:if="${loggedInUser != null}" class="btn" th:href="@{/users/profile}">Account</a>
</header>

</body>
</html>
